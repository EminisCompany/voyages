name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build SubmarineExport/SubmarineExport.csproj -c Release
      - name: Find the plugin zip
        id: zip
        shell: bash
        run: echo "path=$(find SubmarineExport/bin/Release -name latest.zip | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubmarineExport
          path: ${{ steps.zip.outputs.path }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.path }}
