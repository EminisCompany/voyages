name: Publish companion app
on:
  push:
    branches: [claude/ffxiv-companion-pwa-4xd1bk, main]
    paths: ['companion/**', '.github/workflows/companion-pages.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push companion/ to the gh-pages branch
        run: |
          cp -r companion /tmp/site && rm -rf /tmp/site/tools /tmp/site/README.md
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Publish companion app from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
